openapi: 3.0.0
info:
  title: Мой API
  version: 0.0.1
  description: 1st API

servers:
  - url: http://localhost:3000
    description: Locakl server

paths:
  /api/register:
    post:
      tags:
        - Auth
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: test@mail.com
                password:
                  type: string
                  example: "123456"
                name:
                  type: string
                  example: Jovanni
      responses:
        201:
          description: Success
        400:
          description: Error

  /api/login:
    post:
      tags:
        - Auth
      summary: Enter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Success
        401:
          description: Wrong email or password

  /api/customers:
    get:
      tags:
        - Customers
      summary: List of customers
      responses:
        200:
          description: ОК
    post:
      tags:
        - Customers
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                contact:
                  type: string
      responses:
        201:
          description: Success created customer